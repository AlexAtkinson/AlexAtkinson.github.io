name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]  # or your default branch
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt bandit

      - name: Run project checks
        run: |
          chmod +x ./test.sh
          ./test.sh

      - name: Run Markdown lint
        run: npx --yes markdownlint-cli -c .markdownlint.json "**/*.md"

      - name: Run SAST (Bandit)
        run: bandit -q -r scripts

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Add your build steps here if needed
      # For example, if using Jekyll:
      # - name: Build with Jekyll
      #   uses: actions/jekyll-build-pages@v1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'  # or your build output directory

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment. outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4